/* Register only the safe SW (v=20261025a). One-time migration: unregister any
   worker whose scriptURL is not this safe build — old cache SWs poisoned boards. */
(function () {
  if (!("serviceWorker" in navigator)) return;
  var SAFE = "/sw.js?v=20261025a";
  var MARK = "20261025a";
  navigator.serviceWorker.getRegistrations().then(function (rs) {
    return Promise.all(rs.map(function (r) {
      var sw = r.active || r.waiting || r.installing;
      var url = (sw && sw.scriptURL) || "";
      if (url.indexOf(MARK) !== -1) return null;
      return r.unregister();
    }));
  }).then(function () {
    return navigator.serviceWorker.register(SAFE);
  }).catch(function () {});
})();
</script>
