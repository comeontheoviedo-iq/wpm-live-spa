[build]
  publish = "site"
  functions = "netlify/functions"
  command = "echo no-build"

[functions]
  node_bundler = "esbuild"
  included_files = [
    "netlify/functions/wc-parse.mjs",
    "netlify/functions/wave-parse.mjs",
    "netlify/functions/wave-snap-build.mjs",
    "netlify/functions/wave-snap.json",
    "netlify/functions/push-lib.mjs",
    "netlify/functions/follow-tags.mjs",
    "netlify/functions/app-rounds.mjs",
    "netlify/functions/app-dates.mjs",
    "netlify/functions/radar-lib.mjs",
    "netlify/functions/slate-events.mjs"
  ]

[functions.rankings]
  timeout = 26

[functions."wave-snap-refresh"]
  timeout = 26

[functions.app]
  timeout = 26


[functions."push-live-check"]
  timeout = 26

[[redirects]]
  from = "/api/worldcup"
  to = "/.netlify/functions/worldcup"
  status = 200

[[redirects]]
  from = "/api/ppa"
  to = "/.netlify/functions/ppa"
  status = 200

[[redirects]]
  from = "/api/app"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/api/scores"
  to = "/.netlify/functions/scores"
  status = 200

[[redirects]]
  from = "/api/magazine"
  to = "/.netlify/functions/magazine"
  status = 200

[[redirects]]
  from = "/api/rankings"
  to = "/.netlify/functions/rankings"
  status = 200

[[redirects]]
  from = "/api/history"
  to = "/.netlify/functions/history"
  status = 200

[[redirects]]
  from = "/api/radar"
  to = "/.netlify/functions/radar"
  status = 200

[[redirects]]
  from = "/api/push-subscribe"
  to = "/.netlify/functions/push-subscribe"
  status = 200



[[redirects]]
  from = "/api/calendar"
  to = "/.netlify/functions/calendar"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
